<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — T. Chrietzberg</title>
    <meta name="description" content="Write to T. Chrietzberg." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="/">T<span>.</span>C</a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>
      <nav class="site-nav" id="site-nav" data-nav aria-label="Primary">
        <ul>
          <li><a href="/work.html">Work</a></li>
          <li><a href="/about.html">About</a></li>
          <li><a href="/contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="content" class="wrap">
      <section class="section">
        <p class="kicker">Inbox</p>
        <h1 class="page-title">Contact</h1>
        <p class="lede">A short note is enough. The form drafts an email in your mail app.</p>
      </section>

      <section class="section">
        <form class="form" data-contact-form novalidate>
          <label>
            Name
            <input name="name" type="text" autocomplete="name" required minlength="2" />
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Message
            <textarea name="message" required minlength="8" placeholder="What should we talk about?"></textarea>
          </label>
          <div class="actions">
            <button type="submit">Draft email</button>
            <a class="button ghost" href="mailto:tchrietzberg@gmail.com">Or email directly</a>
          </div>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span data-year></span> T. Chrietzberg</p>
      <p>tchrietzberg@gmail.com</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
